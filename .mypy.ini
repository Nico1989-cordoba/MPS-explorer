[mypy]
# Python version (3.10+ required by modern MyPy)
python_version = 3.10

# Core type checking options
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True

# Handle missing stubs for third-party libraries
ignore_missing_imports = True

# Disable strict None checking to work with existing code
strict_optional = False

# Check untyped definitions (less strict than full strict mode)
check_untyped_defs = False

# Warn about unused type: ignore comments
warn_unused_ignores = True

# Per-module configuration
[mypy-tools.*]
ignore_errors = False

[mypy-PyQt5.*]
ignore_errors = True

[mypy-pyqtgraph.*]
ignore_errors = True

[mypy-h5py.*]
ignore_errors = True

[mypy-pandas.*]
ignore_errors = True

[mypy-sklearn.*]
ignore_errors = True

[mypy-hdbscan.*]
ignore_errors = True
