[mypy]
# MyPy Configuration for MPS Explorer
# Type checking for Python 3.7+ codebase

# Python version specification
# Note: MyPy 1.0+ requires Python 3.7+, but strict checking needs 3.10+
# Using 3.10 to support latest MyPy versions
python_version = 3.10

# Core type checking options
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True

# Strict mode options
strict_optional = True
check_untyped_defs = False

# Handle missing stubs from third-party libraries
# PyQt5, PyQtGraph don't have complete type stubs
ignore_missing_imports = True

# Module-specific configurations
# Tools directory (external utilities)
[mypy-tools.*]
ignore_errors = False

# Old code directory (legacy/archived)
[mypy-old.*]
ignore_errors = True

# Skip type checking for specific modules if needed
# [mypy-external_lib]
# ignore_errors = True
