name: Type Check with MyPy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # numpy>=2.5 ships a `type X = ...` (PEP 695) alias in its own
          # __init__.pyi. mypy only accepts that syntax in stub files when
          # --python-version (or, as here, .mypy.ini's python_version) is
          # 3.12+; this project's .mypy.ini pins python_version = 3.10 to
          # validate against its minimum supported interpreter, so newer
          # numpy stubs abort mypy before it reaches any project file
          # ("Type statement is only supported in Python 3.12 and greater"),
          # regardless of which Python this job itself runs on. Pinning
          # numpy's own version here (not the project's runtime numpy,
          # which requirements.txt controls separately) keeps the stub
          # syntax compatible with that check.
          pip install mypy "numpy<2.5"
      
      - name: Run MyPy type checking
        run: |
          python -m mypy \
            tools/clustering.py \
            tools/clustering_strategies.py \
            tools/parallel_clustering.py \
            tools/parameter_cache.py \
            config_loader.py \
            logging_config.py \
            --ignore-missing-imports \
            --explicit-package-bases \
            --show-error-codes
      
      - name: Report success
        if: success()
        run: echo "✓ Type checking passed for Python ${{ matrix.python-version }}"
