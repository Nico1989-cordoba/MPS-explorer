name: Type Check with MyPy

# Every pull request, whatever it is aimed at. The branch filter used to
# be [main, develop], so a pull request stacked on another feature branch
# -- how this repository reviews a long piece of work -- showed no checks
# at all, which reads like "nothing to say" rather than "not run".
# "edited" is included because changing a pull request's base is an edit:
# without it, re-aiming a stacked branch at main still ran nothing.
on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # numpy>=2.5 ships a `type X = ...` (PEP 695) alias in its own
          # __init__.pyi. mypy only accepts that syntax in stub files when
          # --python-version (or, as here, .mypy.ini's python_version) is
          # 3.12+; this project's .mypy.ini pins python_version = 3.10 to
          # validate against its minimum supported interpreter, so newer
          # numpy stubs abort mypy before it reaches any project file
          # ("Type statement is only supported in Python 3.12 and greater"),
          # regardless of which Python this job itself runs on. Pinning
          # numpy's own version here (not the project's runtime numpy,
          # which requirements.txt controls separately) keeps the stub
          # syntax compatible with that check.
          pip install mypy "numpy<2.5"

      # The modules that are clean today, and must stay clean. Everything
      # an export writes is here: a wrong type in these is a wrong number
      # in a table, or a table that is not written at all.
      #
      # --follow-imports=silent: the modules these import are read for
      # their types but their own errors are not reported here, so a
      # pre-existing error in a dependency cannot fail a pull request that
      # did not touch it. The step below counts those instead.
      - name: Run MyPy type checking
        run: |
          python -m mypy \
            tools/axon_export.py \
            tools/axon_export_ui.py \
            tools/mps_batch.py \
            tools/batch_window.py \
            tools/column_dictionary.py \
            tools/mps_identity.py \
            tools/identity_ui.py \
            tools/export_ui.py \
            tools/results_table.py \
            tools/mps_settings.py \
            tools/mps_plot_style.py \
            tools/figure_export.py \
            tools/figure_export_ui.py \
            tools/clustering.py \
            tools/clustering_strategies.py \
            tools/cluster_density.py \
            tools/cluster_tessellation.py \
            tools/voronoi_layer.py \
            tools/plot_mouse.py \
            tools/method_overlay.py \
            tools/cluster_topological.py \
            tools/spatial_stats.py \
            tools/cluster_benchmark.py \
            tools/emitters_prior.py \
            tools/calibration_xi.py \
            tools/cluster_emitters.py \
            tools/emitters_layer.py \
            tools/mps_perimeter_cost.py \
            tools/perimeter_cost_ui.py \
            tools/emitters_precision_ui.py \
            tools/mps_cancel.py \
            tools/method_diagnostics.py \
            tools/ui_search.py \
            tools/mps_progress.py \
            tools/method_costs.py \
            tools/multimethod.py \
            tools/clustering_integration.py \
            tools/compare_analyses_ui.py \
            tools/arrangement_ui.py \
            tools/mps_pipeline_null.py \
            tools/mps_working_scale.py \
            tools/mps_events.py \
            tools/dbscan_rule.py \
            tools/dbscan_sweep.py \
            tools/events_sweep_plugins.py \
            tools/mps_eclipse_tolerance.py \
            tools/mps_eclipse_merged.py \
            tools/mps_apparent_size.py \
            tools/footprint_pool.py \
            tools/lpc_depth.py \
            tools/null_membrane.py \
            tools/two_rings_view.py \
            tools/slow_confirm.py \
            tools/two_rings_ui.py \
            tools/mps_curvature.py \
            tools/mps_size_stats.py \
            tools/mps_size_synth.py \
            tools/size_plugins.py \
            tools/size_curvature_null.py \
            tools/mps_gap_measures.py \
            tools/mps_gap_batch.py \
            tools/mps_background_run.py \
            tools/mps_window_scroll.py \
            tools/parallel_clustering.py \
            tools/parameter_cache.py \
            tools/mps_perimeter_types.py \
            tools/mps_perimeter_slices.py \
            tools/mps_perimeter_bc.py \
            tools/mps_perimeter_a.py \
            tools/mps_perimeter_sim.py \
            tools/mps_trace_id.py \
            tools/mps_auto_contour.py \
            tools/mps_perimeter_analysis.py \
            tools/mps_perimeter_pool.py \
            tools/perimeter_export.py \
            tools/unanchored_export.py \
            tools/mps_unanchored.py \
            batch_perimeter.py \
            tools/mps_perimeter_window.py \
            tools/mps_unanchored_window.py \
            tools/mps_project.py \
            tools/mps_precheck.py \
            tools/launcher_check.py \
            tools/make_synthetic_batch.py \
            config_loader.py \
            logging_config.py \
            --ignore-missing-imports \
            --explicit-package-bases \
            --show-error-codes \
            --follow-imports=silent

      # The rest of the program, for the record and not for the verdict.
      # It carries errors that predate this workflow; failing on them
      # would make every pull request red and teach everyone to ignore
      # the colour. The count is printed so a change that adds to it is
      # visible in the log of the run.
      - name: Count the errors in the rest of the program
        continue-on-error: true
        run: |
          python -m mypy tools/ MPS_explorer.py \
            --ignore-missing-imports \
            --explicit-package-bases \
            --show-error-codes \
            | tail -30 || true

      - name: Report success
        if: success()
        run: echo "✓ Type checking passed for Python ${{ matrix.python-version }}"

  # The tests that need no Qt display (design review 2026-10-29: the CI ran mypy only, no test). The list is the
  # test files that pass with PyQt5 and pyqtgraph NOT installed (checked by running each one with both imports
  # blocked); the GUI tests (*_gui.py and the window tests) still run by hand, each in its own process. Synthetic
  # data only (rule R8). About 20 minutes on the laptop, one process.
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install the scientific dependencies (no Qt)
        run: |
          python -m pip install --upgrade pip
          grep -v -i -E '^(PyQt5|pyqtgraph)' requirements.txt > requirements-headless.txt
          pip install -r requirements-headless.txt pytest

      # test_perimeter_cost.py is not in the list: it imports tools/perimeter_cost_ui.py, which needs PyQt5.
      # The other test_perimeter_*.py and test_unanchored.py were run with PyQt5 and pyqtgraph blocked.
      - name: Run the headless tests
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m pytest -q -p no:cacheprovider \
            test_apparent_size.py \
            test_batch_columns.py \
            test_batch_selection.py \
            test_calibration_xi.py \
            test_channel2_params.py \
            test_cluster_benchmark.py \
            test_cluster_benchmark_emitters.py \
            test_cluster_density.py \
            test_cluster_emitters.py \
            test_cluster_tessellation.py \
            test_cluster_topological.py \
            test_clustering_integration.py \
            test_core_tanda1.py \
            test_dbscan_events_rule.py \
            test_eclipse_tolerance.py \
            test_emitters_acceptance.py \
            test_emitters_integration.py \
            test_emitters_prior.py \
            test_file_match.py \
            test_gap_measures.py \
            test_genotype_pattern.py \
            test_gpu_acceleration.py \
            test_h5e_selection.py \
            test_launcher_precheck.py \
            test_launcher_project.py \
            test_multimethod.py \
            test_nena.py \
            test_phase4_integration.py \
            test_perimeter_a.py \
            test_perimeter_analysis.py \
            test_perimeter_b.py \
            test_perimeter_c.py \
            test_perimeter_contract.py \
            test_perimeter_density.py \
            test_perimeter_export.py \
            test_perimeter_pool_gate.py \
            test_perimeter_sim.py \
            test_perimeter_slices.py \
            test_perimeter_validation.py \
            test_phase_d_edge_margin.py \
            test_pipeline_null.py \
            test_selection.py \
            test_simnull_selection.py \
            test_spatial_stats.py \
            test_validations_d2_e1_e5.py \
            test_ui_tanda2.py \
            test_viability_v2.py \
            test_viability_v2c.py \
            test_zcalibration.py \
            test_zquality.py \
            test_unanchored.py
